<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Texture Pack Directory</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --mc-black: #000000;
      --mc-dark-blue: #0000aa;
      --mc-dark-green: #00aa00;
      --mc-dark-aqua: #00aaaa;
      --mc-dark-red: #aa0000;
      --mc-dark-purple: #aa00aa;
      --mc-gold: #ffaa00;
      --mc-gray: #aaaaaa;
      --mc-dark-gray: #555555;
      --mc-blue: #5555ff;
      --mc-green: #55ff55;
      --mc-aqua: #55ffff;
      --mc-red: #ff5555;
      --mc-light-purple: #ff55ff;
      --mc-yellow: #ffff55;
      --mc-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--primary);
    }

    .stats {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .filter-btn {
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: bold;
    }

    .pack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .pack-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .pack-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .pack-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      word-break: break-word;
      font-family: monospace;
      min-height: 2.4em;
    }

    .pack-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
    }

    .badge-res {
      background: #0284c7;
      color: #fff;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 10px;
      text-align: center;
      background: var(--primary);
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    /* Minecraft Color Codes */
    .mc-0 { color: var(--mc-black); }
    .mc-1 { color: var(--mc-dark-blue); }
    .mc-2 { color: var(--mc-dark-green); }
    .mc-3 { color: var(--mc-dark-aqua); }
    .mc-4 { color: var(--mc-dark-red); }
    .mc-5 { color: var(--mc-dark-purple); }
    .mc-6 { color: var(--mc-gold); }
    .mc-7 { color: var(--mc-gray); }
    .mc-8 { color: var(--mc-dark-gray); }
    .mc-9 { color: var(--mc-blue); }
    .mc-a { color: var(--mc-green); }
    .mc-b { color: var(--mc-aqua); }
    .mc-c { color: var(--mc-red); }
    .mc-d { color: var(--mc-light-purple); }
    .mc-e { color: var(--mc-yellow); }
    .mc-f { color: var(--mc-white); }
    .mc-l { font-weight: bold; }
    .mc-o { font-style: italic; }
    .mc-n { text-decoration: underline; }
    .mc-m { text-decoration: line-through; }
  </style>
</head>

    let currentFilter = 'all';

    function cleanFilename(url) {
      const parts = url.split('/');
      let name = parts[parts.length - 1];
      if (name === 'file' || name === '') {
        name = parts[parts.length - 2] || 'unknown';
      }

      try {
        name = decodeURIComponent(name);
        name = decodeURIComponent(name);
      } catch (e) {}

      name = name.replace(/\.(zip|rar)(\.zip)?$/i, '');
      return name;
    }

    function getResolution(name) {
      const match = name.match(/(16|32|64|128|256|512)\s*x/i) || name.match(/x\s*(16|32|64|128|256|512)/i);
      return match ? match[1].toLowerCase() + 'x' : 'Unknown';
    }

    function parseMcFormatting(str) {
      let cleanStr = str.replace(/_/g, ' ').replace(/\+/g, ' ');
      let tokens = cleanStr.split(/(§[0-9a-fk-or])/gi);
      
      let html = '';
      let currentClasses = [];

      tokens.forEach(token => {
        if (token.startsWith('§') && token.length === 2) {
          let code = token[1].toLowerCase();
          if (code === 'r') {
            currentClasses = [];
          } else {
            currentClasses.push('mc-' + code);
          }
        } else if (token.length > 0) {
          if (currentClasses.length > 0) {
            html += `<span class="${currentClasses.join(' ')}">${escapeHtml(token)}</span>`;
          } else {
            html += escapeHtml(token);
          }
        }
      });

      return html || escapeHtml(cleanStr);
    }

    function getRawText(str) {
      return str.replace(/§[0-9a-fk-or]/gi, '').replace(/_/g, ' ').replace(/\+/g, ' ');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const packData = rawLinks.map(url => {
      const filename = cleanFilename(url);
      return {
        url: url,
        filename: filename,
        rawText: getRawText(filename),
        htmlTitle: parseMcFormatting(filename),
        res: getResolution(filename)
      };
    });

    function renderPacks() {
      const grid = document.getElementById('packGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      grid.innerHTML = '';
      let count = 0;

      packData.forEach(pack => {
        const matchesSearch = pack.rawText.toLowerCase().includes(search);
        let matchesFilter = true;

        if (currentFilter === '16x') matchesFilter = pack.res === '16x';
        else if (currentFilter === '32x') matchesFilter = pack.res === '32x';
        else if (currentFilter === '64x') matchesFilter = pack.res === '64x';
        else if (currentFilter === '128x+') matchesFilter = ['128x', '256x', '512x'].includes(pack.res);

        if (matchesSearch && matchesFilter) {
          count++;
          const card = document.createElement('div');
          card.className = 'pack-card';
          
          const isRar = pack.url.endsWith('.rar/file');
          const extBadge = isRar ? '<span class="badge">.rar</span>' : '<span class="badge">.zip</span>';
          const resBadge = pack.res !== 'Unknown' ? `<span class="badge badge-res">${pack.res}</span>` : '';

          card.innerHTML = `
            <div>
              <div class="pack-title">${pack.htmlTitle}</div>
              <div class="pack-meta">
                ${resBadge}
                ${extBadge}
              </div>
            </div>
            <a href="${pack.url}" target="_blank" class="download-btn">Download (MediaFire)</a>
          `;
          grid.appendChild(card);
        }
      });

      document.getElementById('packCount').innerText = `${count} Packs Shown`;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPacks();
    }

    function filterPacks() {
      renderPacks();
    }

    // Initial render
    renderPacks();
  </script>
